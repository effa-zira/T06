<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T06-1 - Interactive Histogram</title>
    
    <!-- Load the CSS files -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/visualisations.css">
</head>
<body>
    <header>
        <h1>TV Energy Consumption</h1>
    </header>
    
    <main>
        <div>
            <h2>Energy Consumption for different TV screen types and sizes</h2>
            <p>Most TVs on sale in Australia are LED and they vary considerably in energy consumption.</p>
            
            <!-- Container for the filter buttons -->
            <div id="filters_screen"></div>
            
            <!-- Container for the histogram chart -->
            <div id="histogram" class="responsive-svg-container"></div>
            
            <div class="data-source">
                <h3>Data source</h3>
                <p>Energy Rating Data for household appliances – Televisions<br>Downloaded Jan 2025</p>
            </div>
        </div>
    </main>
    
    <footer>
        <p>&copy; 2025 Data Visualisation Week 6</p>
    </footer>

    <!-- Load D3 library first -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    
    <!-- Load shared constants -->
    <script src="js/shared-constants.js"></script>
    
    <!-- Load drawing functions -->
    <script src="js/histogram.js"></script>
    <script src="js/interactions.js"></script>
    
    <!-- Load data loader LAST (it needs to call the functions above) -->
    <script src="js/load-data.js"></script>
</body>
</html>
